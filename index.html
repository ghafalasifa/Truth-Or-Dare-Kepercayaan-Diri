<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF Care and Connect</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Icons -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        navy: {500:'#1e3a5f'},
        accent: {DEFAULT:'#4ca1ff'}
      }
    }
  }
}
</script>

<style>
body {font-family:'Plus Jakarta Sans', sans-serif;}
.page{display:none}
.page.active{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#fff;padding:10px 20px;border-radius:10px}
</style>

<!-- FIREBASE CONFIG -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBYB3TiXc4Nec6B47hsrEMey9ak4kLvA_A",
  authDomain: "df-care.firebaseapp.com",
  projectId: "df-care",
  storageBucket: "df-care.firebasestorage.app",
  messagingSenderId: "58040438574",
  appId: "1:58040438574:web:e5be03307f898c014634bf"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
</script>

</head>

<body class="bg-gray-100">

<!-- LOGIN -->
<div id="loginPage" class="h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow w-80 text-center">

    <h1 class="text-xl font-bold mb-4">DF Care</h1>

    <button onclick="login('siswa')" class="w-full bg-blue-500 text-white py-2 rounded mb-2">
      Masuk sebagai Siswa
    </button>

    <button onclick="login('guru')" class="w-full bg-navy-500 text-white py-2 rounded mb-2">
      Masuk sebagai Guru
    </button>

    <button onclick="loginGoogle()" class="w-full bg-red-500 text-white py-2 rounded">
      Login dengan Google
    </button>

  </div>
</div>

<!-- APP -->
<div id="mainApp" class="hidden p-4">

  <div class="flex justify-between mb-4">
    <span id="roleLabel"></span>
    <button onclick="logout()">Logout</button>
  </div>

  <div id="pageBeranda" class="page active">
    <h2 class="text-lg font-bold">Beranda</h2>
    <p>Selamat datang di aplikasi BK Digital</p>
  </div>

</div>

<script>

// LOGIN BIASA
function login(role){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('roleLabel').textContent = role;
}

// LOGIN GOOGLE
function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(result => {
    const user = result.user;

    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');

    document.getElementById('roleLabel').textContent = user.displayName;

    showToast("Login berhasil ✅");
  })
  .catch(err => {
    console.error(err);
    showToast("Login gagal ❌");
  });
}

// LOGOUT
function logout(){
  auth.signOut();
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
}

// TOAST
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

</script>

</body>
</html>
